<svg width="1100" height="430" viewBox="0 0 1100 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Persona inspired confidant menu</title>
  <desc id="desc">A readable red, black, and white menu panel for Hans with Persona inspired accents.</desc>

  <rect width="1100" height="430" fill="#050507"/>

  <!-- simple Persona-style header -->
  <rect x="32" y="34" width="1036" height="96" fill="#F2F2F2"/>
  <rect x="32" y="62" width="1036" height="40" fill="#FF0033"/>
  <path d="M32 34H230L188 130H32V34Z" fill="#050507"/>
  <path d="M858 34H1068L1008 130H808L858 34Z" fill="#050507"/>
  <path d="M72 52L146 44L134 76L194 76L124 108L132 88L72 102V52Z" fill="#F2F2F2"/>

  <!-- section title strip -->
  <rect x="70" y="158" width="520" height="48" fill="#F2F2F2"/>
  <rect x="84" y="170" width="492" height="24" fill="#050507"/>
  <text x="102" y="189" font-family="Impact, Arial Black, Arial, sans-serif" font-size="24" fill="#F2F2F2" letter-spacing="1">CONFIDANT FILE</text>
  <text x="402" y="189" font-family="Arial Black, Arial, sans-serif" font-size="13" fill="#FF0033" letter-spacing="2">HANS</text>
  <path d="M590 158L640 158L606 206H590V158Z" fill="#F2F2F2"/>

  <!-- main content panel -->
  <rect x="70" y="230" width="650" height="150" fill="#F2F2F2"/>
  <rect x="88" y="248" width="614" height="114" fill="#111118"/>

  <rect x="112" y="270" width="168" height="70" fill="#FF0033"/>
  <text x="136" y="305" font-family="Impact, Arial Black, Arial, sans-serif" font-size="36" fill="#F2F2F2">HANS</text>
  <text x="136" y="329" font-family="Arial Black, Arial, sans-serif" font-size="13" fill="#050507" letter-spacing="1">SENIOR CS STUDENT</text>

  <rect x="310" y="268" width="360" height="34" fill="#F2F2F2"/>
  <text x="332" y="291" font-family="Arial Black, Arial, sans-serif" font-size="15" fill="#050507">WEB DEVELOPER</text>
  <text x="480" y="291" font-family="Arial Black, Arial, sans-serif" font-size="12" fill="#FF0033">FRONTEND / BACKEND</text>

  <rect x="310" y="316" width="360" height="34" fill="#FF0033"/>
  <text x="332" y="339" font-family="Arial Black, Arial, sans-serif" font-size="14" fill="#F2F2F2">ASK ME ABOUT WEB, BACKENDS, DATABASES</text>

  <rect x="112" y="356" width="286" height="34" fill="#F2F2F2"/>
  <text x="136" y="378" font-family="Arial Black, Arial, sans-serif" font-size="13" fill="#050507">GAMES / MUSIC / INSTRUMENTS</text>

  <rect x="422" y="356" width="178" height="34" fill="#050507" stroke="#F2F2F2" stroke-width="4"/>
  <text x="452" y="378" font-family="Arial Black, Arial, sans-serif" font-size="13" fill="#F2F2F2">CONTACT READY</text>

  <!-- right content panel -->
  <rect x="760" y="172" width="288" height="208" fill="#F2F2F2"/>
  <rect x="780" y="192" width="248" height="168" fill="#111118"/>

  <rect x="804" y="214" width="200" height="56" fill="#FF0033"/>
  <text x="826" y="243" font-family="Impact, Arial Black, Arial, sans-serif" font-size="24" fill="#F2F2F2">CURRENT ARC</text>
  <text x="826" y="263" font-family="Arial Black, Arial, sans-serif" font-size="12" fill="#050507">ML + DEEP LEARNING</text>

  <rect x="804" y="292" width="200" height="46" fill="#F2F2F2"/>
  <text x="826" y="317" font-family="Impact, Arial Black, Arial, sans-serif" font-size="22" fill="#050507">MAIN QUEST</text>
  <text x="826" y="334" font-family="Arial Black, Arial, sans-serif" font-size="11" fill="#FF0033">BUILD USEFUL SOFTWARE</text>

  <rect x="804" y="352" width="200" height="34" fill="#FF0033"/>
  <text x="822" y="375" font-family="Arial Black, Arial, sans-serif" font-size="13" fill="#F2F2F2">READY FOR NEW PROJECTS</text>

  <!-- minimal accents -->
  <rect x="108" y="200" width="38" height="38" transform="rotate(38 108 200)" fill="#FF0033"/>
  <rect x="188" y="194" width="42" height="42" transform="rotate(38 188 194)" fill="#F2F2F2"/>
  <rect x="958" y="112" width="38" height="38" transform="rotate(-17 958 112)" fill="#FF0033"/>
  <circle cx="44" cy="402" r="6" fill="#F2F2F2" opacity="0.75"/>
  <circle cx="68" cy="402" r="5" fill="#F2F2F2" opacity="0.65"/>
  <circle cx="90" cy="402" r="4" fill="#F2F2F2" opacity="0.55"/>
</svg>
